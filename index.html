<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Exemplo Cypress</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 60px auto;
        padding: 20px;
      }
      input,
      button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 10px 0;
        padding: 10px;
      }
      button {
        cursor: pointer;
      }
      #mensagem {
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Exemplo de Teste com Cypress</h1>

    <form id="login-form">
      <label for="email">E-mail</label>
      <input id="email" type="email" data-testid="email" />

      <label for="senha">Senha</label>
      <input id="senha" type="password" data-testid="senha" />

      <button id="login-button" type="submit" data-testid="login">
        Entrar
      </button>
    </form>

    <p id="mensagem"></p>

    <script>
      document
        .getElementById("login-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const email = document.getElementById("email").value;
          const senha = document.getElementById("senha").value;
          const mensagem = document.getElementById("mensagem");

          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, senha }),
          });

          const data = await response.json();
          mensagem.textContent = data.mensagem;
        });
    </script>
  </body>
</html>
